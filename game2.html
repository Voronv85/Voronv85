            display: block;

        #uiContainer {

        #eventMessage {
            position: absolute;

        #botInfo {
    position: absolute;
    top: 50%;

}

#botInfo h2 {
    margin-top: 0;

}

#botInfo ul {
    list-style-type: none;
    padding-left: 0;
    margin: 0;
}

#botInfo li {
    margin-bottom: 8px;
    font-size: 14px;
}

.hidden {
    display: none;
}

       #exit-button {
  position: fixed;
  top: 1px;
  left: 1px;
  z-index:1000; /* поверх всего */

  color: white;

  border-radius: 5px;
  text-decoration: none;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
  animation: pulse 2s infinite;
  transition: transform 0.2s ease;
}

#exit-button:hover {
  background: rgba(76, 175, 80, 0.7);
  
}

@keyframes pulse {
  0% {
    transform: scale(1);
    opacity: 0.5;
  }
  50% {
    transform: scale(1.05);
    opacity: 0.1;
  }
  100% {

}

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;

       const BOT_TYPES = [

        // Конфиги предметов
     const ITEM_TYPES = [
    { 
        type: 'speed', 
        color: '#0ff', 
        apply: p => {

            else showMessage("Максимальная скорость достигнута");

    },
    { 
        type: 'fireRate',

            if (newReloadTime !== p.reloadTime) {

    },
    { 
        type: 'damage',

        apply: p => {

            else showMessage("Максимальный урон достигнут");
        } 
    },
    { 
        type: 'regen',

        } 
    }
];
        const ITEM_SPAWN_CHANCE = 0.7;

        // Эффект столкновения
        class Effect {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.life = 30; this.maxLife = 30;
            }
            update() { this.life--; }
            draw() {
                const t = 1 - this.life / this.maxLife;
                const radius = 5 + t * 50;
                ctx.beginPath();
                ctx.arc(this.x, this.y, radius, 0, 2 * Math.PI);
                ctx.fillStyle = `rgba(255,255,255,${1 - t})`;
                ctx.fill();
                ctx.strokeStyle = `rgba(255,255,255,${0.8 - t * 0.8})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            isAlive() { return this.life > 0; }
        }

        class Bullet {
            constructor(x, y, angle, owner, damage = 1) {
                this.x = x; this.y = y; this.speed = 5; this.angle = angle;
                this.size = 5; this.owner = owner; this.damage = damage;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, 2 * Math.PI);
                ctx.fillStyle = '#ff0'; ctx.fill();
            }
            update() {
                this.x += Math.sin(this.angle) * this.speed;
                this.y -= Math.cos(this.angle) * this.speed;
            }
            isOut() {
                return this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height;
            }
        }

        class Tank {
            constructor(x, y, cfg, isPlayer = false) {
                this.x = x;
                this.y = y;
                this.size = 30;
                this.dir = 0;
                this.color = cfg.color;
                // Базовые параметры
this.speed = cfg.speed;
this.reloadTime = cfg.reloadTime;
this.damage = cfg.damage;

// Максимальные ограничения
this.maxSpeed = 8;     // Макс скорость
this.minReloadTime = 10; // Мин время перезарядки (чем меньше — тем быстрее стреляет)
this.maxDamage = 10;   // Макс урон

this.visionRange = cfg.visionRange;
this.bullets = [];
this.reload = 0;
this.isPlayer = isPlayer;
this.health = cfg.health || 5;
                this.visionTimeout = 0;
                this.canSee = false;
                this.health = cfg.health || 5;
                this._pulseTime = 0; // Для пульсации
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.dir * Math.PI / 2);

                if (this.isPlayer) {
                    this._pulseTime += 0.05;
                    if (this._pulseTime > 2 * Math.PI) this._pulseTime -= 2 * Math.PI;
                    const pulse = 0.5 + 0.5 * Math.sin(this._pulseTime);
                    
                      // Аура бессмертия
if (this.invulnerable) {
    this._pulseTime += 0.05;
    if (this._pulseTime > 2 * Math.PI) this._pulseTime -= 2 * Math.PI;

    const pulse = 0.5 + 0.5 * Math.sin(this._pulseTime); // 0.5 ... 1.0
    const auraRadius = this.size * (0.7 + 0.3 * pulse); // Радиус ауры пульсирует

    // Создаём градиентную ауру
    const gradient = ctx.createRadialGradient(
        this.x, this.y, this.size * 0.4,
        this.x, this.y, auraRadius
    );
    gradient.addColorStop(0, 'rgba(0, 255, 255, 0)');
    gradient.addColorStop(0.6, 'rgba(0, 255, 255, 0.3)');
    gradient.addColorStop(1, 'rgba(0, 255, 255, 0)');

    ctx.beginPath();
    ctx.arc(this.x, this.y, auraRadius, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();

    // Лёгкое свечение
    ctx.shadowColor = 'rgba(0, 255, 255, 0.7)';
    ctx.shadowBlur = 15;
}
                    
                    // Пульсируемый размер гусениц и ствола (±10%)
                    const trackScale = 1 + 0.1 * pulse;
                    const barrelScale = 1 + 0.1 * pulse;

                    // Пульсирующие гусеницы (тёмный синий с изменением прозрачности)
                    ctx.fillStyle = `rgba(20, 50, 100, ${0.6 + 0.4 * pulse})`;
                    ctx.fillRect(
                        (-this.size / 2 - 4) * trackScale,
                        -this.size / 2,
                        8 * trackScale,
                        this.size
                    );
                    ctx.fillRect(
                        (this.size / 2 - 4) * trackScale,
                        -this.size / 2,
                        8 * trackScale,
                        this.size
                    );

                    // Корпус без пульсации
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-this.size / 2 + 4, -this.size / 2 + 4, this.size - 8, this.size - 8);
                   
                    // Башня (без пульсации, обычный цвет)
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size / 4, 0, 2 * Math.PI);
                    ctx.fillStyle = '#468';
                    ctx.fill();

                    // Пульсирующий ствол (тёмный синий)
                    ctx.fillStyle = `rgba(20, 50, 100, ${0.6 + 0.4 * pulse})`;
                    ctx.fillRect(-3, (-this.size / 2 - 10) * barrelScale, 6, 20 * barrelScale);

                } else {
                    // Гусеницы без пульсации
                    ctx.fillStyle = '#333';
                    ctx.fillRect(-this.size / 2 - 4, -this.size / 2, 8, this.size);
                    ctx.fillRect(this.size / 2 - 4, -this.size / 2, 8, this.size);

                    // Корпус
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-this.size / 2 + 4, -this.size / 2 + 4, this.size - 8, this.size - 8);

                    // Башня
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size / 4, 0, 2 * Math.PI);
                    ctx.fillStyle = '#555';
                    ctx.fill();

                    // Ствол
                    ctx.fillStyle = '#444';
                    ctx.fillRect(-3, -this.size / 2 - 10, 6, 20);
                }
                        
                        ctx.shadowBlur = 0;
                        ctx.shadowColor = 'transparent';
                        
                ctx.restore();
                if (this.health <0) this.health = 0;
                // Полоска здоровья
                // Фоновая линия (едва заметная)
                ctx.fillStyle = 'rgba(100, 100, 100, 0.2)';
                ctx.fillRect(this.x - this.size/2, this.y - this.size/2 - 12, this.size, 2);

                // Основное здоровье (тонкая линия)
                ctx.fillStyle = 'rgba(200, 255, 200, 0.7)';
                ctx.fillRect(this.x - this.size/2, this.y - this.size/2 - 12, this.size * (this.health/5), 2);

                // Обновление пуль
                this.bullets.forEach(b => b.draw());

                // Отрисовка зоны видимости бота
                if (!this.isPlayer) {
                    const centerAng = this.dir * Math.PI / 2;
                    const halfFOV = 0.3;
                    const startAng = centerAng - halfFOV;
                    const endAng = centerAng + halfFOV;

                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(
                        this.x + Math.sin(startAng) * this.visionRange,
                        this.y - Math.cos(startAng) * this.visionRange
                    );
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(
                        this.x + Math.sin(endAng) * this.visionRange,
                        this.y - Math.cos(endAng) * this.visionRange
                    );

                    ctx.strokeStyle = 'rgba(200,200,0,0.3)';
                    ctx.lineWidth = 0.3;
                    ctx.stroke();
                }

                // Обработка столкновений
                resolveCollision(this);
            }

            move(dx, dy) {
                const nx = this.x + dx * this.speed;
                const ny = this.y + dy * this.speed;

                if (!isCollidingWithObstacle(nx, ny, this.size)) {
                    this.x = Math.max(this.size / 2, Math.min(canvas.width - this.size / 2, nx));
                    this.y = Math.max(this.size / 2, Math.min(canvas.height - this.size / 2, ny));
                }
            }

            rotate(d) {
                this.dir = d;
            }

            shoot() {
                if (this.reload <= 0) {
                    const ang = this.dir * Math.PI / 2;
                    const bx = this.x + Math.sin(ang) * (this.size / 2 + 10);
                    const by = this.y - Math.cos(ang) * (this.size / 2 + 10);
                    this.bullets.push(new Bullet(bx, by, ang, this, this.damage));
                    this.reload = this.reloadTime;

                    if (this.isPlayer) playShootSound();
                }
            }

            update() {
                if (this.reload > 0) this.reload--;
                if (this.visionTimeout > 0) this.visionTimeout--;
                this.bullets.forEach(b => b.update());
                this.bullets = this.bullets.filter(b => !b.isOut());
            }
        }


        class Item {
            constructor(x, y, cfg) {
                this.x = x; this.y = y; this.size = 15;
                this.type = cfg.type; this.color = cfg.color; this.apply = cfg.apply;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, 2 * Math.PI);
                ctx.fillStyle = this.color; ctx.fill();
                ctx.fillStyle = '#000'; ctx.font = '12px Arial'; ctx.textAlign = 'center';
                ctx.fillText(this.type, this.x, this.y + 4);
            }
            collect(p) { this.apply(p); }
        }

        const player = new Tank(canvas.width / 2, canvas.height / 2,
            { speed: 2, reloadTime: 30, damage: 1, visionRange: 300, color: '#FFFFFF' }, true);
            
        player.invulnerable = true; // <-- Начинаем с бессмертием
        setTimeout(() => {
    if (player) {
        player.invulnerable = false;
        console.log("Бессмертие закончилось");
    }
}, 3000); // 3 секунды бессмертия

        const bots = [], items = [], effects = [];

       for (let i = 0; i < maxBots; i++) {
    const cfg = BOT_TYPES[Math.floor(Math.random() * BOT_TYPES.length)];
    bots.push(new Tank(
        Math.random() * canvas.width,
        Math.random() * canvas.height,
        cfg
    ));
    }

        function resumeAudio() {
        if (audioCtx.state !== 'running') {
        audioCtx.resume();
        }
        }

         function showMessage(message) {
            const eventMessage = document.getElementById('eventMessage');
            eventMessage.textContent = message;
            eventMessage.classList.add('show');
            updatePlayerStats();
           
            setTimeout(() => {
                eventMessage.classList.remove('show');

        }

        function updatePlayerStats() {
            const stats = document.getElementById('playerStats');
            stats.innerHTML = `
        🚗 Скорость: ${player.speed}

      `;
        }

        function showBotInfo() {
    const botInfo = document.getElementById('botInfo');
    const botInfoList = document.getElementById('botInfoList');
    botInfoList.innerHTML = ''; // Очистка

    BOT_TYPES.forEach(bot => {
        const li = document.createElement('li');
        li.innerHTML = `
            <strong style="color:${bot.color}">${bot.name}</strong><br>
            &nbsp;&nbsp;Скорость: ${bot.speed}<br>
            &nbsp;&nbsp;Прочность: ${bot.health}<br>
            &nbsp;&nbsp;Урон: ${bot.damage}<br>
            &nbsp;&nbsp;Диапазон: ${bot.visionRange}<br>
            &nbsp;&nbsp;Перезарядка: ${bot.reloadTime}
        `;
        botInfoList.appendChild(li);
    });

    botInfo.classList.remove('hidden');
}

        function resolveCollision(tank) {
            obstacles.forEach(o => {
                if (isCollidingWithObstacle(tank.x, tank.y, tank.size)) {
                    // Простейшая коррекция: двигаем танк в случайном направлении
                    let dx = (Math.random() - 0.5) * 10;
                    let dy = (Math.random() - 0.5) * 10;
                    tank.x += dx;
                    tank.y += dy;
                }
            });
        }

        function botAI(bot) {
            const dx = player.x - bot.x;
            const dy = player.y - bot.y;
            const dist = Math.hypot(dx, dy);
            const angTo = Math.atan2(dx, -dy);
            const botAng = bot.dir * Math.PI / 2;

            const inSight =
                Math.abs(botAng - angTo) < 0.3
                && dist < bot.visionRange
                && !isCollidingWithObstacle(
                    (bot.x + player.x) / 2,
                    (bot.y + player.y) / 2,
                    10
                );

            // Сохраняем в боте
            bot.canSee = inSight;
            // где-то в начале botAI(bot) или в Tank.update():
            if (bot.visionTimeout > 0) {
                bot.visionTimeout--;
                if (bot.visionTimeout === 0) {
                    bot.visionRange = bot._baseVisionRange;
                    bot.canSee = false;
                }
            }
            if (inSight) {
                bot.move(Math.round(Math.sin(botAng)), -Math.round(Math.cos(botAng)));
                bot.shoot();
            } else {
                // существующая логика «бродилки»
                if (!bot.aiTime || bot.aiTime <= 0) {
                    bot.aiDir = Math.floor(Math.random() * 4);
                    bot.aiTime = 50 + Math.random() * 100;
                }
                bot.move([0, 1, 0, -1][bot.aiDir], [-1, 0, 1, 0][bot.aiDir]);
                bot.rotate(bot.aiDir);
                bot.aiTime--;
            }
        }

        function playMoveSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            // Основной низкочастотный гул
            osc.type = 'sawtooth';
            osc.frequency.value = 60; // Снижена частота для мягкости

            // Фильтр для подавления высоких частот
            filter.type = 'lowpass';
            filter.frequency.value = 300;

            // Плавная атака и затухание
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

            // Соединяем цепочку
            osc.connect(filter).connect(gain).connect(audioCtx.destination);

            // Запуск
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // Звук выстрела (короткий мощный)
        function playShootSound() {
            const duration = 0.08;
            const masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            masterGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            // Басовая компонента

        function playExplosionSound2() {
            const duration = 1.0;
            const masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(2.0, audioCtx.currentTime);
            masterGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

            // Создаём кривую дисторшна
            const distortion = audioCtx.createWaveShaper();
            function makeDistortionCurve(amount) {
                const n_samples = 44100;
                const curve = new Float32Array(n_samples);
                for (let i = 0; i < n_samples; i++) {
                    const x = i * 2 / n_samples - 1;
                    curve[i] = (Math.PI + amount) * x / (Math.PI + amount * Math.abs(x));
                }
                return curve;
            }
            distortion.curve = makeDistortionCurve(100); // Максимальный дисторшн

            // Основной сигнал (пилообразная волна)
            const osc = audioCtx.createOscillator();

        }

            // 3) Удаление мёртвых ботов
            for (let i = bots.length - 1; i >= 0; i--) {

            }
            // 4) Сбор предметов игроком

function drawRoundedRect(x, y, w, h, r) {
    ctx.beginPath();

        function isCollidingWithObstacle(x, y, size, isBullet = false) {
            return obstacles.some(o => {
                const inX = x + size / 2 > o.x && x - size / 2 < o.x + o.w;
                const inY = y + size / 2 > o.y && y - size / 2 < o.y + o.h;
                if (inX && inY) {
                    if (isBullet && o.type === 'brick') {
                        o.health--;
                        if (o.health <= 0) obstacles.splice(obstacles.indexOf(o), 1);
                        return true;
                    }
                    return o.type !== 'water' || !isBullet;
                }
                return false;
            });
        }

            case 'down': player.rotate(2); player.move(0, 1); break;
            case 'left': player.rotate(3); player.move(-1, 0); break;
            case 'right': player.rotate(1); player.move(1, 0); break;
        }
       let lastMoveSound = 0;
if (currentDirection && Date.now() - lastMoveSound > 150) {
    playMoveSound();
    lastMoveSound = Date.now();
}
    }

    // === Конец сенсорного управления ===

    player.update();
    bots.forEach(b => { botAI(b); b.update(); });
    checkCollisions();

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawObstacles();
    player.draw();
    bots.forEach(b => b.draw());
    items.forEach(it => it.draw());
    effects.forEach(e => e.draw());

    requestAnimationFrame(update);
}

        botCounter.textContent = `Ботов осталось: ${bots.length}`;
        update();


// Сенсорное управление
let touchStart = null;
let touchTime = 0;

const MOVE_THRESHOLD = 20;

canvas.addEventListener('touchstart', e => {
    if (e.touches.length) {
        const t = e.touches[0];
        touchStart = { x: t.clientX, y: t.clientY };
        currentDirection = null;
        touchTime = Date.now();
    }
});

canvas.addEventListener('touchmove', e => {
    if (!gameActive || !touchStart || !e.touches.length) return;

    const t = e.touches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;

    if (Math.hypot(dx, dy) > MOVE_THRESHOLD && !currentDirection) {
        if (Math.abs(dx) > Math.abs(dy)) {
            currentDirection = dx > 0 ? 'right' : 'left';
        } else {
            currentDirection = dy > 0 ? 'down' : 'up';
        }
    } else if (Math.hypot(dx, dy) > MOVE_THRESHOLD * 0.5) {
        // Обновляем направление, если движение явно изменилось
        let newDir = null;
        if (Math.abs(dx) > Math.abs(dy)) {
            newDir = dx > 0 ? 'right' : 'left';
        } else {
            newDir = dy > 0 ? 'down' : 'up';
        }
        if (newDir !== currentDirection) {
            currentDirection = newDir;
        }
    }
});

canvas.addEventListener('touchend', e => {
    if (!gameActive) return;

    if (Date.now() - touchTime < 200) {
        player.shoot();
    }

    touchStart = null;
    currentDirection = null;
});


        restartButton.addEventListener('click', () => location.reload());
    </script>
