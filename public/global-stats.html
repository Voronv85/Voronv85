<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const tableBody = document.querySelector('#globalStats tbody');
    const statusDiv = document.createElement('div');
    statusDiv.style.margin = '20px';
    document.body.insertBefore(statusDiv, document.querySelector('button'));

    try {
      statusDiv.textContent = 'Загрузка данных...';
      statusDiv.style.color = 'blue';
      
      const response = await fetch('/api/user/top');
      
      if (!response.ok) {
        throw new Error(`Ошибка сервера: ${response.status}`);
      }
      
      const data = await response.json();
      
      if (!data || data.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="4">Нет данных для отображения</td></tr>';
        statusDiv.textContent = 'Нет данных';
        statusDiv.style.color = 'orange';
        return;
      }
      
      tableBody.innerHTML = data.map(user => `
        <tr>
          <td>${user.name || 'Аноним'}</td>
          <td>${user.wins || 0}</td>
          <td>${user.losses || 0}</td>
          <td>${formatDate(user.last_updated)}</td>
        </tr>
      `).join('');
      
      statusDiv.textContent = `Загружено ${data.length} записей`;
      statusDiv.style.color = 'green';
      
    } catch (error) {
      console.error('Ошибка:', error);
      statusDiv.textContent = `Ошибка: ${error.message}`;
      statusDiv.style.color = 'red';
      
      tableBody.innerHTML = `
        <tr>
          <td colspan="4" style="color: red;">
            Ошибка загрузки данных. Пожалуйста, попробуйте позже.
          </td>
        </tr>
      `;
    }
  });

  function formatDate(dateString) {
    if (!dateString) return 'Неизвестно';
    const options = { 
      year: 'numeric', 
      month: 'long', 
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    };
    return new Date(dateString).toLocaleDateString('ru-RU', options);
  }
</script>
