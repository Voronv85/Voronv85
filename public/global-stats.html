<script>
  async function loadGlobalStats() {
    const loader = document.createElement('div');
    loader.textContent = 'Загрузка данных...';
    document.body.appendChild(loader);
    
    try {
      const response = await fetch('/api/user/top');
      
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      
      const data = await response.json();
      const tbody = document.querySelector('#globalStats tbody');
      
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4">Нет данных</td></tr>';
        return;
      }
      
      tbody.innerHTML = data.map(user => `
        <tr>
          <td>${user.name || 'Без имени'}</td>
          <td>${user.wins || 0}</td>
          <td>${user.losses || 0}</td>
          <td>${user.last_updated ? new Date(user.last_updated).toLocaleString() : 'Неизвестно'}</td>
        </tr>
      `).join('');
      
    } catch (error) {
      console.error('Ошибка:', error);
      document.querySelector('#globalStats tbody').innerHTML = `
        <tr>
          <td colspan="4" style="color: red;">
            Ошибка загрузки: ${error.message}
          </td>
        </tr>
      `;
    } finally {
      document.body.removeChild(loader);
    }
  }

  // Загружаем данные при открытии страницы
  document.addEventListener('DOMContentLoaded', loadGlobalStats);
</script>
