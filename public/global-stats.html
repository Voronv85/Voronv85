<script>
  async function loadGlobalStats() {
    const tableBody = document.querySelector('#globalStats tbody');
    const statusDiv = document.createElement('div');
    statusDiv.style.margin = '20px';
    document.body.insertBefore(statusDiv, tableBody);

    try {
      statusDiv.textContent = 'Загрузка статистики...';
      statusDiv.style.color = 'blue';

      const response = await fetch('/api/user/top');
      const data = await response.json();

      if (!Array.isArray(data)) {
        throw new Error('Некорректный формат данных');
      }

      if (data.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="4">Пока нет данных о игроках</td></tr>';
        statusDiv.textContent = 'Нет данных для отображения';
        statusDiv.style.color = 'orange';
        return;
      }

      tableBody.innerHTML = data.map(user => `
        <tr>
          <td>${user.name || 'Аноним'}</td>
          <td>${user.wins || 0}</td>
          <td>${user.losses || 0}</td>
          <td>${formatDate(user.last_updated)}</td>
        </tr>
      `).join('');

      statusDiv.textContent = `Загружено ${data.length} записей`;
      statusDiv.style.color = 'green';

    } catch (error) {
      console.error('Ошибка:', error);
      statusDiv.textContent = `Ошибка: ${error.message}`;
      statusDiv.style.color = 'red';
      tableBody.innerHTML = `
        <tr>
          <td colspan="4" style="color: red;">
            Ошибка при загрузке данных. Пожалуйста, обновите страницу.
          </td>
        </tr>
      `;
    }
  }

  function formatDate(dateString) {
    if (!dateString) return 'Неизвестно';
    try {
      return new Date(dateString).toLocaleString('ru-RU');
    } catch {
      return dateString;
    }
  }

  // Загружаем данные при открытии страницы
  document.addEventListener('DOMContentLoaded', loadGlobalStats);
</script>
