<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Вход</title>
</head>
<body>

    <h1>Добро пожаловать!</h1>
    <input type="text" id="username" placeholder="Введите имя" />
    <button onclick="saveUserData()">Начать</button>

    <script>
        const userId = localStorage.getItem("userId");
        const userName = localStorage.getItem("userName");

        // Если пользователь уже есть — сразу перейти на games.html
        if (userId && userName) {
            window.location.href = "games.html";
        }

        function generateUniqueId() {
            return 'user-' + Math.random().toString(36).substr(2, 9);
        }

        function saveUserData() {
            const nameInput = document.getElementById("username");
            const name = nameInput.value.trim();

            const id = generateUniqueId();
            const defaultName = name || id;

            // Сохраняем локально
            localStorage.setItem("userId", id);
            localStorage.setItem("userName", defaultName);
            localStorage.setItem("userWins", 0);
            localStorage.setItem("userLosses", 0);
            localStorage.setItem("userLevel", 1);

            // Отправляем данные на сервер
            fetch('http://localhost:3000/update-user', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    userId: id,
                    name: defaultName
                })
            })
                .then(response => response.json())
                .then(data => {
                    console.log('Пользователь обновлён:', data);
                    window.location.href = "games.html";
                })
                .catch(err => {
                    console.error('Ошибка при сохранении данных:', err);
                    alert('Не удалось сохранить данные на сервере.');
                    window.location.href = "games.html";
                });
        }
    </script>

</body>
</html>
