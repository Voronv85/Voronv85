<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Игровая статистика</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
    .container { text-align: center; margin-top: 50px; }
    .loader { margin: 20px; font-size: 18px; }
    button { padding: 10px 20px; margin-top: 20px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Загрузка вашей статистики...</h1>
    <div class="loader" id="loader">Проверяем локальные данные...</div>
  </div>

  <script>
    // Проверка и инициализация данных
    async function initUserData() {
      const loader = document.getElementById('loader');
      
      // 1. Проверяем localStorage
      let user = JSON.parse(localStorage.getItem('gameUser'));
      
      // 2. Если нет данных - создаем нового пользователя
      if (!user) {
        loader.textContent = 'Создаем новый профиль...';
        user = {
          id: generateId(),
          name: 'Игрок #' + Math.floor(Math.random() * 1000),
          wins: 0,
          losses: 0
        };
        localStorage.setItem('gameUser', JSON.stringify(user));
      }
      
      // 3. Синхронизируем с Supabase
      loader.textContent = 'Синхронизация с сервером...';
      
      try {
        // Проверяем есть ли пользователь в БД
        const response = await fetch(`/api/user/${user.id}`);
        const dbUser = await response.json();
        
        // Обновляем данные (если в БД есть более свежие)
        if (dbUser && dbUser.last_updated) {
          const localDate = new Date(user.last_updated || 0);
          const dbDate = new Date(dbUser.last_updated);
          
          if (dbDate > localDate) {
            Object.assign(user, dbUser);
            localStorage.setItem('gameUser', JSON.stringify(user));
          } else if (localDate > dbDate) {
            await saveToDatabase(user);
          }
        } else {
          await saveToDatabase(user);
        }
        
        // Переходим на страницу статистики
        window.location.href = '/stats';
      } catch (error) {
        console.error('Ошибка синхронизации:', error);
        loader.textContent = 'Ошибка соединения. Используем локальные данные.';
        setTimeout(() => window.location.href = '/stats', 2000);
      }
    }
    
    // Сохранение в Supabase
    async function saveToDatabase(user) {
      await fetch('/api/user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ...user,
          last_updated: new Date().toISOString()
        })
      });
    }
    
    // Генератор ID
    function generateId() {
      return 'user_' + Math.random().toString(36).substr(2, 9);
    }
    
    // Запускаем при загрузке
    window.onload = initUserData;
  </script>
</body>
</html>
