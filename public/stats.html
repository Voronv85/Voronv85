<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Ваша статистика</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
    .stats { background: #f5f5f5; padding: 20px; border-radius: 10px; margin: 20px 0; }
    .stat-row { display: flex; justify-content: space-between; margin: 10px 0; }
    button { padding: 10px 20px; margin-top: 20px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Ваша игровая статистика</h1>
    
    <div class="stats" id="stats">
      <!-- Данные будут загружены из localStorage -->
    </div>
    
    <button onclick="window.location.href='/global-stats.html'">
      Посмотреть глобальную статистику
    </button>
  </div>

  <script>
    // Загрузка данных из localStorage
    function loadStats() {
      const user = JSON.parse(localStorage.getItem('gameUser')) || {};
      const statsDiv = document.getElementById('stats');
      
      statsDiv.innerHTML = `
        <div class="stat-row">
          <span>ID игрока:</span>
          <span>${user.id || 'Неизвестно'}</span>
        </div>
        <div class="stat-row">
          <span>Имя:</span>
          <span>${user.name || 'Гость'}</span>
        </div>
        <div class="stat-row">
          <span>Победы:</span>
          <span>${user.wins || 0}</span>
        </div>
        <div class="stat-row">
          <span>Поражения:</span>
          <span>${user.losses || 0}</span>
        </div>
        <div class="stat-row">
          <span>Последняя синхронизация:</span>
          <span>${user.last_updated ? new Date(user.last_updated).toLocaleString() : 'Никогда'}</span>
        </div>
      `;
    }
    
    window.onload = loadStats;
  </script>
</body>
</html>
