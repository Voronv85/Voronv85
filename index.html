<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Supabase Chat</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 600px; margin: auto; }
    input, textarea, button { width: 100%; padding: 10px; margin-top: 10px; }
    ul { list-style: none; padding: 0; }
    li { background: #f0f0f0; margin-bottom: 5px; padding: 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>💬 Supabase Chat</h1>

  <form id="messageForm">
    <textarea id="text" placeholder="Введите ваше сообщение..." required></textarea>
    <button type="submit">Отправить</button>
  </form>

  <h2>Сообщения:</h2>
  <ul id="messagesList"></ul>

  <script src="main.js"></script>
</body>
</html>
