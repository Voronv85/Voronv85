<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Стартовая страница игр</title>
  <style>
    :root {
      --bg-gradient-start: #1a202c;
      --bg-gradient-end: #2d3748;
      --card-bg: rgba(30, 41, 59, 0.8);
      --primary-color: #63b3ed;
      --secondary-color: #f6ad55;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, var(--bg-gradient-start), var(--bg-gradient-end));
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 450px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease;
    }

    .header {
      background: linear-gradient(90deg, #4f46e5, #3b82f6);
      padding: 1.5rem;
      text-align: center;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }

    .content {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 0.5rem;
      outline: none;
      background: #1e293b;
      color: white;
      font-size: 1rem;
    }

    button {
      padding: 0.75rem;
      border: none;
      border-radius: 0.5rem;
      background: linear-gradient(90deg, #3b82f6, #4f46e5);
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    button:hover {
      transform: scale(1.02);
      background: linear-gradient(90deg, #2563eb, #3b82f6);
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin-top: 1rem;
    }

    .game-button {
      padding: 1rem;
      background: #2563eb;
      border-radius: 0.5rem;
      text-align: center;
      font-weight: bold;
      transition: all 0.2s ease;
      text-decoration: none;
      color: white;
    }

    .game-button:hover {
      background: #1d4ed8;
      transform: scale(1.03);
    }

    .footer {
      background: #111827;
      padding: 1rem;
      text-align: center;
      font-size: 0.75rem;
      color: #718096;
    }

    .username-info {
      text-align: center;
      margin-bottom: 1rem;
    }

    .change-name {
      margin-top: 1rem;
      display: inline-block;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.875rem;
    }

    .change-name:hover {
      text-decoration: underline;
    }

    .stats {
      background: #1e293b;
      padding: 1rem;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Добро пожаловать!</h1>
      <p>Выберите игру и начните играть</p>
    </div>
    <div class="content" id="app">
      <!-- Контент будет подгружаться динамически -->
    </div>
    <div class="footer">
      © 2025 Игровая платформа | Все права защищены
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
