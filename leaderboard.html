<!DOCTYPE html>
<html>
<head>
  <title>Лидеры</title>
</head>
<body>
  <h1>Таблица лидеров</h1>
  <ul id="list"></ul>

  <script>
    fetch('/api/players')
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById('list');
        data.sort((a, b) => b.score - a.score).forEach(player => {
          const li = document.createElement('li');
          li.textContent = `${player.name} — ${player.score}`;
          list.appendChild(li);
        });
      });
  </script>
</body>
</html>
